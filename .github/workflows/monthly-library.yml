name: Monthly library refresh

on:
  schedule:
    - cron: "0 3 1 * *"   # 1st of each month, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build candidates
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          MAX_CALLS: "120"
        run: python3 scripts/build_library.py
      - name: Commit candidates
        run: |
          git config user.name "weekend-bot"
          git config user.email "weekend-bot@users.noreply.github.com"
          git add web/data/candidates.json
          git diff --cached --quiet || git commit -m "Monthly library refresh"
          git push
