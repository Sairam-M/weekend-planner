name: Weekly plan (Thursday evening)

on:
  schedule:
    - cron: "30 12 * * 4"   # 12:30 UTC Thursday = 18:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build picks
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: python3 scripts/plan_week.py
      - name: Commit picks
        run: |
          git config user.name "weekend-bot"
          git config user.email "weekend-bot@users.noreply.github.com"
          git add web/data/picks.json
          git diff --cached --quiet || git commit -m "Weekly picks"
          git push
      # TODO: send Web Push (VAPID) once subscriptions are stored in the Worker.
